<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Mobius disk for the Dirichlet beta function with Catalan constant at the centre"><style>
.t{font-family:Georgia,'Times New Roman',serif;fill:#edf4eb} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#bfd2c8} .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#bfd2c8}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b6e0d2;letter-spacing:2px} .g{fill:#e8c170} .c{fill:#f08a6c} .w{fill:#edf4eb}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 14s cubic-bezier(.5,0,.3,1) infinite}
@keyframes dr{0%{stroke-dashoffset:1;opacity:1}25%{stroke-dashoffset:0}95%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.pop{opacity:.2;animation:pop 14s ease-out infinite}
@keyframes pop{0%{opacity:.2}6%{opacity:1}95%{opacity:1}100%{opacity:.2}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.9);opacity:.35}}
.spin{animation:sp 80s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{to{transform:rotate(360deg)}}
</style><rect width="600" height="400" rx="18" fill="#163b43"/><g><path d="M40 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M80 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M120 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M160 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M200 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M240 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M280 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M320 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M360 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M400 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M440 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M480 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M520 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M560 0V400" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 40H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 80H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 120H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 160H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 200H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 240H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 280H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 320H600" stroke="#35585f" stroke-width="1" opacity=".18"/><path d="M0 360H600" stroke="#35585f" stroke-width="1" opacity=".18"/></g><text x="32" y="44" class="k" font-size="13">COMPLEX · EXACT COORDINATE CHANGE</text><text x="32" y="82" class="t" font-size="26">Catalan’s constant at the centre</text><circle cx="165" cy="222" r="120" fill="#203f47" stroke="#e8c170" stroke-width="2.5" opacity=".22"/><circle cx="165" cy="222" r="120" fill="#203f47" stroke="#e8c170" stroke-width="2.5" pathLength="1" class="draw"/><circle cx="195.0" cy="222" r="90.0" fill="none" stroke="#b6e0d2" stroke-width="1.3" opacity="0.9" class="pop" style="animation-delay:1.5s"/><circle cx="225.0" cy="222" r="60.0" fill="none" stroke="#b6e0d2" stroke-width="1.3" opacity="0.75" class="pop" style="animation-delay:2.2s"/><circle cx="249.0" cy="222" r="36.0" fill="none" stroke="#b6e0d2" stroke-width="1.3" opacity="0.6000000000000001" class="pop" style="animation-delay:2.9s"/><circle cx="268.6" cy="222" r="16.4" fill="none" stroke="#b6e0d2" stroke-width="1.3" opacity="0.45000000000000007" class="pop" style="animation-delay:3.5999999999999996s"/><circle cx="165" cy="222" r="6" fill="#e8c170" class="pulse"/><text x="153" y="208" class="m g" font-size="13" text-anchor="end">w = 0</text><circle cx="285" cy="222" r="4" fill="#edf4eb"/><text x="293" y="246" class="m" font-size="12">s = ∞</text><g><circle cx="45" cy="222" r="5.5" fill="#f08a6c"/><animateTransform attributeName="transform" type="rotate" from="0 165 222" to="360 165 222" dur="14s" repeatCount="indefinite"/></g><text x="350" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#edf4eb">w = (s − 2)/(s + 1)</text><text x="350" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#edf4eb">F(w) = β((2 + w)/(1 − w))</text><text x="350" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e8c170">F(0) = β(2) = G</text><text x="350" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#e8c170">≈ 0.9159655942</text><text x="350" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f08a6c">|w| = 1  ⇔  Re s = 1/2</text><text x="350" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#bfd2c8">the boundary is the</text><text x="350" y="291" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#bfd2c8">critical line of β</text><text x="350" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b6e0d2">inner circles: Re s = 1, 2, 4, 10</text><text x="32" y="384" class="s" font-size="12">A coordinate change, not a zero-location result. Open: which operator lives on this disk.</text></svg>