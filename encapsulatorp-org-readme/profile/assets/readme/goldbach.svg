<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Goldbach prime pairs of 100 drawn as mirror arcs about the centre 50"><style>
.t{font-family:Georgia,'Times New Roman',serif;fill:#edf4eb} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#bfd2c8} .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#bfd2c8}
